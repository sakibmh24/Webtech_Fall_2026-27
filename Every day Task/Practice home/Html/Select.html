<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Fieldset and Legend</title>
</head>
<body>
    <h1>Patient Registration Form</h1>
     <form>
        <fieldset>
            <legend>Patient Information</legend>
           
            
            <table>
                <tr>
                    <td><label for="Citizen">Citizenship:</label></td>
                    <td>
                        <select>
                            <option id="blank">--Select Country</option>
                            <option id="BD">Bangladesh</option>
                            <option id="IND">India</option>
                            <option id="PAK">Pakistan</option>





                        </select>
                    </td>
                </tr>








            </table>
            













        </fieldset>








     </form>
    
</body>
</html>
